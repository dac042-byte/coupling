<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coupling - Find Your Match</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">Coupling</div>
        <div class="theme-toggle">
          <button class="theme-toggle-btn" id="themeToggle" style="padding: 8px 12px; font-size: 12px;">
            <span id="themeText">☀️</span>
          </button>
        </div>
      </div>

      <div class="nav-menu">
        <div class="nav-item active" data-page="swipe">
          <span class="nav-icon">🔥</span>
          <span>Discover</span>
        </div>
        <div class="nav-item" data-page="matches">
          <span class="nav-icon">💬</span>
          <span>Matches</span>
        </div>
        <div class="nav-item" data-page="profile">
          <span class="nav-icon">👤</span>
          <span>Profile</span>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="user-profile">
          <img src="" alt="Avatar" class="user-avatar" id="sidebarAvatar">
          <div class="user-info">
            <h4 id="sidebarName">Loading...</h4>
            <p id="sidebarUniversity">...</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Swipe Page -->
      <div id="swipePage" class="page-content">
        <div class="swipe-container">
          <div id="swipeCardContainer"></div>
        </div>
      </div>

      <!-- Matches Page -->
      <div id="matchesPage" class="page-content" style="display: none;">
        <div class="matches-container">
          <div class="matches-list">
            <div class="matches-header">
              <h2>Matches</h2>
            </div>
            <div id="matchesList"></div>
          </div>

          <div class="chat-container">
            <div id="chatEmpty" class="empty-state">
              <div>
                <h3>Select a match</h3>
                <p>Choose a conversation from your matches to start chatting</p>
              </div>
            </div>

            <div id="chatActive" style="display: none; flex-direction: column; height: 100%;">
              <div class="chat-header">
                <img src="" alt="Avatar" class="user-avatar" id="chatAvatar">
                <div>
                  <h2 id="chatName"></h2>
                  <p id="chatUniversity"></p>
                </div>
              </div>

              <div class="chat-messages" id="chatMessages"></div>

              <div class="chat-input-container">
                <form class="chat-input-form" id="chatForm">
                  <input
                    type="text"
                    class="chat-input"
                    id="messageInput"
                    placeholder="Type a message..."
                    required
                  >
                  <button type="submit" class="send-btn">Send</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Profile Page -->
      <div id="profilePage" class="page-content" style="display: none;">
        <div class="profile-container">
          <div class="profile-card">
            <div class="profile-header">
              <img src="" alt="Avatar" class="profile-avatar-large" id="profileAvatar">
              <h2 id="profileName">Loading...</h2>
              <p id="profileEmail"></p>
            </div>

            <div class="profile-section">
              <h3>University</h3>
              <p id="profileUniversity"></p>
            </div>

            <div class="profile-section">
              <h3>Country</h3>
              <p id="profileCountry"></p>
            </div>

            <div class="profile-section">
              <h3>User Type</h3>
              <p id="profileUserType"></p>
            </div>

            <div class="profile-section" id="profileBioSection">
              <h3>Bio</h3>
              <p id="profileBio"></p>
            </div>

            <div class="profile-section" id="profileSkillsSection" style="display: none;">
              <h3>Skills</h3>
              <p id="profileSkills"></p>
            </div>

            <div class="profile-section" id="profileProjectSection" style="display: none;">
              <h3>Project Idea</h3>
              <p id="profileProject"></p>
            </div>

            <div class="profile-section" id="profileEquitySection" style="display: none;">
              <h3>Equity/Compensation</h3>
              <p id="profileEquity"></p>
            </div>

            <div class="profile-section" id="profileTimelineSection" style="display: none;">
              <h3>Timeline</h3>
              <p id="profileTimeline"></p>
            </div>

            <button class="logout-btn" id="logoutBtn">Sign Out</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Match Modal -->
  <div id="matchModal" class="match-modal" style="display: none;">
    <div class="match-modal-content">
      <h2>It's a Match! 🎉</h2>
      <p>You and <span id="matchedUserName"></span> liked each other</p>
      <div class="match-avatars">
        <img src="" alt="You" class="match-avatar-large" id="matchAvatar1">
        <img src="" alt="Match" class="match-avatar-large" id="matchAvatar2">
      </div>
      <button class="btn btn-primary" onclick="closeMatchModal()">Keep Swiping</button>
      <button class="btn btn-secondary" onclick="goToMatches()">Send Message</button>
    </div>
  </div>

  <script src="/js/theme.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
